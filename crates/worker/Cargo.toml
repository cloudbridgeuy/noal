[package]
name = "noal_worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The imperative shell for noal. An axum application on Cloudflare Workers."

[lib]
# Cloudflare loads the module through wasm-bindgen glue, so this must be a
# cdylib. `rlib` is kept so `cargo test` can still build the crate for the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
noal_core.workspace = true
noal_view.workspace = true

worker.workspace = true
worker-macros.workspace = true

axum.workspace = true
tower-service.workspace = true

tokio-postgres.workspace = true
maud.workspace = true

base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
rig-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

console_error_panic_hook.workspace = true
send_wrapper.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
